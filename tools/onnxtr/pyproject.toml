[project]
name = "bookforge-ocr-onnxtr"
version = "0.1.0"
description = "Persistent OnnxTR bridge used by Bookforge's OCR adapter (tools/ocr-onnxtr.py)."
# OnnxTR's own floor. onnxruntime does SIMD dispatch at runtime, so one wheel
# covers old and new CPUs alike — the reason this tier runs almost anywhere.
requires-python = ">=3.11,<4"
dependencies = [
    "onnxtr[cpu]==0.9.0",
]

[project.optional-dependencies]
# Intel Macs: onnxruntime publishes arm64-only macOS wheels from 1.24.1 onwards.
intel-mac = ["onnxruntime==1.23.2"]

[tool.uv]
# `ocr-onnxtr.py` is a standalone script invoked by path, not an importable
# package — there is nothing here to build or publish.
package = false
